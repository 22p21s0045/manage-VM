- name: Check if monitoring network exists
  community.docker.docker_network_info:
    name: monitoring-network
  register: monitoring_network_check
  ignore_errors: true

- name: Create monitoring docker network
  community.docker.docker_network:
    name: monitoring-network
    state: present
  when: monitoring_network_check.network is not defined or monitoring_network_check.network | length == 0

- name: Create grafana data directory
  file:
    path: "{{ monitoring_dir }}/grafana-data"
    state: directory
    mode: '0777'

- name: Create grafana config directory
  file:
    path: "{{ monitoring_dir }}/grafana-config"
    state: directory
    mode: '0755'

- name: Delete existing provisioning directory if it exists
  file: 
    path: "{{ monitoring_dir }}/grafana-config/provisioning"
    state: absent

- name: Copy all provisioning files
  copy:
    src: provisioning/
    dest: "{{ monitoring_dir }}/grafana-config/provisioning/"
    mode: '0644'
  register: copy_result

- name: Debug - Show copy result
  debug:
    var: copy_result

# - name: Verify provisioning files on server
#   shell: find {{ monitoring_dir }}/provisioning -type f
#   register: provision_files

# - name: Show provisioning files
#   debug:
#     var: provision_files.stdout_lines

- name: Deploy Grafana configuration file
  template:
    src: grafana.ini.j2
    dest: "{{ monitoring_dir }}/grafana-config/grafana.ini"
    mode: '0644'
  notify: Restart Prometheus container

- name: Delete existing dashboards directory if it exists
  file: 
    path: "{{ monitoring_dir }}/grafana-dashboards"
    state: absent

- name: Create grafana dashboards directory
  file: 
    path: "{{ monitoring_dir }}/grafana-dashboards"
    state: directory
    mode: '0755'

- name: Copy Grafana dashboard files
  copy:
    src: dashboards/
    dest: "{{ monitoring_dir }}/grafana-dashboards/"
    mode: '0644'
  register: dashboard_copy_result

- name: Debug - Show dashboard copy result
  debug:
    var: dashboard_copy_result

- name: Create Docker compose file for Grafana
  template:
    src: compose.yml.j2
    dest: "{{ monitoring_dir }}/compose-grafana.yml"
    mode: '0644'

- name: Deploy Grafana using Docker Compose
  shell: |
    cd {{ monitoring_dir }} && docker compose -f compose-grafana.yml up -d --force-recreate
  register: compose_result 

- name: Wait for services to be ready
  pause:
    seconds: 5

- name: Check Grafana container status
  shell: docker ps --filter "name=grafana" --format "table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}"
  register: grafana_container_status

- name: Display Grafana container status
  debug:
    var: grafana_container_status.stdout_lines
    
- name: Ensure Grafana is reachable
  uri:
    url: "http://localhost:3000"
    method: GET
    status_code: 200
  register: grafana_http_check
  retries: 5
  delay: 10
  until: grafana_http_check.status == 200

- name: Debug - Show Grafana HTTP check result
  debug:
    var: grafana_http_check

- name: Display Grafana HTTP check status

  debug:
    msg: "Grafana is reachable with status code {{ grafana_http_check.status }}"

- name: Notify about Grafana deployment
  debug:
    msg: "Grafana has been deployed and is accessible at http://localhost:3000
          Default credentials are admin/admin. Please change the password upon first login."


