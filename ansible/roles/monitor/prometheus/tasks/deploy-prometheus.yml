- name: Check if monitoring network exists
  community.docker.docker_network_info:
    name: monitoring-network
  register: monitoring_network_check
  ignore_errors: true

- name: Create monitoring docker network
  community.docker.docker_network:
    name: monitoring-network
    state: present
  when: monitoring_network_check.network is not defined or monitoring_network_check.network | length == 0

- name: Create monitoring directory
  file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: '0755'

- name: Create prometheus data directory
  file:
    path: "{{ monitoring_dir }}/prometheus-data"
    state: directory
    mode: '0777'

- name: Deploy Prometheus configuration file
  template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus.yml"
    mode: '0644'
  notify: Restart Prometheus container

- name: Create Docker compose file for Prometheus
  template:
    src: compose.yml.j2
    dest: "{{ monitoring_dir }}/compose-prometheus.yml"
    mode: '0644'

- name: Deploy Prometheus using Docker Compose
  shell: |
    cd {{ monitoring_dir }} && docker compose -f compose-prometheus.yml up -d --force-recreate
  register: compose_result

- name: Wait for services to be ready
  pause:
    seconds: 5

- name: Check Prometheus container status
  shell: docker ps --filter "name=prometheus" --format "table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Ports{{"}}"}}"
  register: prometheus_container_status

- name: Display Prometheus container status
  debug:
    var: prometheus_container_status.stdout_lines
    
- name: Ensure Prometheus is reachable
  uri:
    url: "http://localhost:9090/-/ready"
    method: GET
    status_code: 200
  register: prometheus_http_check
  retries: 5
  delay: 10
  until: prometheus_http_check.status == 200

- name: Debug - Show Prometheus HTTP check result
  debug:
    var: prometheus_http_check

- name: Display Prometheus HTTP check status
  debug:
    msg: "Prometheus is reachable with status code {{ prometheus_http_check.status }}"

- name: Notify about Prometheus deployment
  debug:
    msg: "Prometheus has been deployed and is accessible at http://localhost:9090"



      