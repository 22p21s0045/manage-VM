---
- name: Deploy Demo Project
  hosts: docker_nodes
  become: true
  vars:
    project_repo: https://github.com/22p21s0045/project-for-sre-v2.git
    project_dest: /home/{{ ansible_user }}/int531-demo-project

  tasks:
    - name: Install git
      apt:
        name: git
        state: present

    - name: Clone demo project from GitHub
      git:
        repo: "{{ project_repo }}"
        dest: "{{ project_dest }}"
        clone: yes
        update: yes
      become_user: "{{ ansible_user }}"

    - name: Run docker compose
      shell: docker compose -f docker-compose.prod.yml up -d
      args:
        chdir: "{{ project_dest }}"
      ignore_errors: yes
